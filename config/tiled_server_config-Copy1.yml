# Alternative for your tiled_server_config.yml if you ONLY care about serving .msgpack files
# without using your existing catalog.yml
authentication:
  allow_anonymous_access: true

trees:
  # Native Tiled SQLite catalog (keep if you want this still)
  - path: /
    tree: catalog
    args:
      uri: "sqlite:////home/b_thampy/data/bluesky_data/catalog.db"
      writable_storage: "/home/b_thampy/data/bluesky_data"
      init_if_not_exists: true

  # Bluesky data directly from msgpack files using Tiled's native driver
  - path: /bluesky_msgpack_native
    tree:
      # This should work as it's a native Tiled driver, not an adapter
      # and it bypasses the need for the IntakeAdapter class
      driver: bluesky-msgpack-catalog
      args:
        paths:
          - "/home/b_thampy/data/bluesky_data/*.msgpack" # Assumes your msgpack files are here